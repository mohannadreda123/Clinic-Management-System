<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic Management System - Presentation & Documentation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            text-align: center;
        }
        h1 {
            color: #333;
        }
        .pdf-container {
            width: 100%;
            max-width: 1000px;
            height: 80vh;
            margin: 20px auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .img-container {
            margin-top: 40px;
        }
        .img-container img {
            max-width: 90%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <h1>Clinic Management System Presentation</h1>
    
    <div class="pdf-container">
        <iframe src="Presentation.pdf"></iframe>
    </div>

    <div class="img-container">
        <h2>UML Diagram</h2>
        <img src="UML-Diagram.png" alt="UML Diagram">
    </div>

</body>
</html>
